name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run workflow tests
        run: npm test
      - name: Build the production bundle
        run: npm run build

  backend:
    name: Production API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-api-dev.txt
      - name: Install API dependencies
        run: pip install -r requirements-api-dev.txt
      - name: Run mocked-provider tests
        run: python -m pytest inkroom_api/tests -q

  container:
    name: Build and smoke-test the container
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: inkroom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the image in demo mode
        run: docker run -d --name inkroom-ci -e DEMO_MODE=true -p 8000:8000 inkroom:ci
      - name: Wait for the API and check readiness
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null; then
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/health
          curl -fsS http://127.0.0.1:8000/api/config | grep -Eq '"ready":[[:space:]]*true'
          curl -fsS http://127.0.0.1:8000/api/config | grep -Eq '"demo":[[:space:]]*true'
          curl -fsS http://127.0.0.1:8000/ | grep -q 'Inkroom'
      - name: Show container logs on failure
        if: failure()
        run: docker logs inkroom-ci
      - name: Stop the container
        if: always()
        run: docker rm -f inkroom-ci || true
